<!DOCTYPE HTML>
<HTML>

<head>
    <meta name="fetch" content="false">
    <meta name="description"
        content="Blockly-editor integration for <a href='https://www.arduino.cc' targe='_blank'>Arduino</a>. See the possible the possible configuration options:<br><br><a href='https://github.com/Cross-Lab-Project/edrys_module-blockly-duino-v2' target='_blank'>https://github.com/Cross-Lab-Project/edrys_module-blockly-duino-v2</a>" />
    <meta name="show-in" content="*" />
    <meta charset="utf-8">
    <meta name="google" value="notranslate">
    <meta http-equiv="X-Content-Security-Policy" content="default-src 'self'; script-src 'self'">
    <meta 
      name="module-config" 
      content="{
        'config': {
          'runCommand': {
            'type': string,
            'hint': 'Message to listen to (Default: execute)'
          },
          'board': {
            'type': string,
            'hint': 'Board name (e.g.: arduino_mega)'
          },
          'code': {
            'type': text-area,
            'hint': 'To initialize the editor (Check the module repo for examples)'
          },
        },
      }" 
    />

    <title>blocklyduino</title>
    <link rel="icon" type="image/png" href="blocklyduino/media/logo_only.png" />
    <link rel="stylesheet" href="css/font_awesome_all.min.css" />
    <link rel="stylesheet" href="css/keyboard_nav.css" />
    <link rel="stylesheet" href="css/lateral-panel.css" />
    <link rel="stylesheet" href="css/UI.css" />
    <link rel="stylesheet" href="blocklyduino/css/blocklyduino.css" />
    <link rel="stylesheet" href="blocklyduino/css/override_css.css" />
    <style>
        /* Problems with the Edrys configuration, pinned over the bottom of the workspace. */
        #edrysErrors {
            position: fixed;
            left: 0.5rem;
            right: 0.5rem;
            bottom: 0.5rem;
            z-index: 100;
            padding: 0.5rem 0.75rem;
            border-radius: 6px;
            background: #b8384a;
            color: #fff;
            font-family: sans-serif;
        }
        #edrysErrors[hidden] {
            display: none;
        }
        #boardLabel {
            margin-left: 0.5rem;
            font-weight: normal;
        }
    </style>
</head>

<body>
    <div class="table_wrapper">
        <table id="globalTable">
            <tr id="optionsTop">

                                    <span id="saveXMLButton_span"></span>
                                </button>
                                <span id="saveXMLButton_span_menu" class="menu_text"
                                    onclick="Code.saveXmlBlocklyFile()"></span>
                                <br>
                                <button id="saveCodeButton" class="iconButtons" onclick="Code.saveCodeFile()">
                                    <span id="saveCodeButton_span"></span>
                                </button>
                                <span id="saveCodeButton_span_menu" class="menu_text"
                                    onclick="Code.saveCodeFile()"></span>
                                <br>
                                <hr>
                                <button id="parametersButton" class="iconButtons"

                                        <i class="fas fa-question"></i>

                            </div>
                        </div>
                    </div>

                    </button>

                    </button>

                                </button>

                                <hr>

                                </button>
                                <span id="htmlButton_span_menu" class="menu_text"></span>

                                <hr>
                                <button id="papyrusConnect" class="iconButtons CLI" onclick="papyrusConnect()">

                        </div>
                    </div>

                    </button>

                    <div style="float:right">
                        <button id="copyCodeButton" class="iconButtons" onclick="Code.copyToClipboard()">

                            </span>
                        </button>

                            <span id="uploadButton_span">
                                <i class="fas fa-sign-out-alt"></i>

                        </button>
                    </div>


                </td>
            </tr>

            <tr id="globalWorkspace">
                <td colspan="2">
                    <div class="content_wrapper">

                            <div id="content_area">
                                <div id="content_blocks"></div>
                            </div>
                            <div id="separator">
                                <label id="editorReadOnlyToggle" class="switch">
                                    <input type="checkbox" onclick="toggleEditorReadOnly(this)">

                                </label>
                            </div>

                    </div>
                </td>
            </tr>
        </table>
    </div>
    <div id="edrysErrors" role="alert" hidden></div>
    <div id="helpModal" class="helpModal">

            <span id="helpModalSpan_title"></span>
        </div>

            <span id="helpModalSpan_text"></span>
        </div>
    </div>

        </div>

    </div>
    <div id="lateral-panel-setup" style="display: none;">
        <input id="lateral-panel-setup-input" type="checkbox">
        <label id="lateral-panel-setup-label" for="lateral-panel-setup-input" class="label_panel">
            <span id="setup_side_span">
                <i class="fas fa-cog"></i>
            </span>
        </label>
        <div id="lateral-panel-setup-bloc">
            <button class="accordion">
                <span id="config_UI_title_span" aria-expanded="false" aria-controls="accordion_setup_content"></span>
            </button></button>
            <div id="setup_content" class="side_content config_content panel">
                <form id="options">
                    <select id="boardMenu" style='display:none'>
                        <option value="none" selected="selected">...</option>
                        <option value="arduino_leonardo">Arduino Leonardo</option>
                        <option value="arduino_mega">Arduino Mega</option>
                        <option value="arduino_micro">Arduino Micro</option>
                        <option value="arduino_mini">Arduino Mini</option>
                        <option value="arduino_nano">Arduino Nano</option>
                        <option value="arduino_pro8">Arduino Pro Mini 3.3V</option>
                        <option value="arduino_pro16">Arduino Pro Mini 5V</option>
                        <option value="arduino_uno">Arduino Uno</option>
                        <option value="arduino_yun">Arduino Yùn</option>
                        <option value="lilypad">LilyPad</option>
                    </select>
                    <br>
                    <span id="languageSpan" class="UIText">...</span>
                    <select id="languageMenu"></select>
                    <br>
                    <br>
                    <span id="interfaceColorSpan" class="UIText">...</span>
                    <select id="interfaceColorMenu">
                        <option value="arduino" selected="selected">blocklyduino2</option>
                    </select>
                    <br>
                    <span id="codeEditorColorSpan" class="UIText">...</span>
                    <select id="codeEditorColorMenu">
                        <option value="arduino" selected="selected">blocklyduino2</option>
                    </select>
                    <br>
                    <br>
                    <span id="themeSpan" class="UIText">...</span>
                    <select name="theme" onchange="changeTheme(this.value)">
                        <option value="classic" id="themeClassicSpan">classic</option>
                        <option value="modern" id="themeModernSpan">modern</option>
                        <option value="deuteranopia" id="themeDeuteranopiaSpan">deuteranopia</option>
                        <option value="tritanopia" id="themeTritanopiaSpan">tritanopia</option>
                        <option value="zelos" id="themeZelosSpan">zelos</option>
                        <option value="high_contrast" id="themeHighContrastSpan">high_contrast</option>
                        <option value="dark" id="themeDarkSpan">dark</option>
                        <option value="blackWhite" id="themeBwSpan">blackWhite</option>
                    </select>
                    <br>
                    <span id="renderSpan" class="UIText">...</span>
                    <select name="renderer" onchange="document.forms.options.submit('options')">
                        <option value="geras">Geras</option>
                        <option value="thrasos">Thrasos</option>
                        <option value="zelos">Zelos</option>
                        <option value="minimalist">Minimalist</option>
                    </select>
                </form>
                <br>
                <span id="displaySpan" class="UIText">...</span>
                <select name="displayChoice" onchange="">
                    <option value="button" id="displayChoiceButtons">buttons</option>
                    <option value="buttonText" id="displayChoiceBandT">buttons + text</option>
                    <option value="text" id="displayChoiceText">text</option>
                </select>
                <br>
                <br>
                <span id="fontSpan" class="UIText">...</span>
                <select name="fontChoice" onchange="document.forms.options.submit('options')">
                    <option value="arial">Arial</option>
                    <option value="comics">Comic Sans MS</option>
                    <option value="luciole">Luciole</option>
                    <option value="opendyslexic">Open Dyslexic</option>
                    <option value="trebuchet">Trebuchet MS</option>
                    <option value="verdana">Verdana</option>
                </select>
                <br>
                <span id="fontSizeSpan" class="UIText"></span>
                <select id="rendering-constant-selector">
                    <option value="fontSizeBlocks" id="optionFontSizeBlocks" selected="selected">Blocks & Editor Font
                        Size</option>
                    <option value="fontSizePage" id="optionFontSizePage">Page Font Size</option>
                    <option value="fontSpacingPage" id="optionFontSpacingPage">Page Font Spacing</option>
                </select>
                <br>
                <input type="range" min="3" max="50" value="4" oninput="Code.changeRenderingConstant(this.value)"
                    onchange="Code.changeRenderingConstant(this.value)" />
                <br>
                <br>
                <input id="accessibilityModeCheck" type="checkbox" onclick="toggleAccessibilityMode(this.checked)">
                <span id="accessibilitySpan" class="UIText"></span>
                <br>
                <input id="displayKeyMappings" type="checkbox" onclick="toggleDisplayKeyMappings(this.checked)">
                <span id="keyMappingSpan" class="UIText"></span>
                <br>
                <select id="cursorChanger" name="cursor" onchange="changeCursor(this.value)">
                    <option value="default" id="defaultCursorSpan">default</option>
                    <option value="basic" id="basicCursorSpan">basic</option>
                    <option value="line" id="lineCursorSpan">line</option>
                </select>
                <br>
            </div>
            <button class="accordion">
                <span id="CLI_title_span" aria-expanded="false" aria-controls="accordion_CLI_content"></span>
            </button>
            <div id="CLI_content" class="side_content config_content CLI panel">
                <div id="configCLI">
                    <div id="CLI_title">

                    <input type="text" class="controlPanelInput" id="installLibInput" name="installLibInput">
                    <button id="installLibButton" class="iconButtons CLI" onclick="">
                        <span id="installLibButton_span">
                            <i class="fas fa-cloud-download-alt"></i>
                        </span>
                    </button>
                    <br>
                </div>
            </div>
            <button class="accordion">

            </button>

                        <i class="fas fa-network-wired"></i>

                </button>
                <br>

                <input type="text" class="controlPanelInput" id="papyrusConnectInput" name="papyrusConnectInput">
                <button id="papyrusConnect" class="iconButtons CLI" onclick="papyrusConnect()">
                    <span id="papyrusConnect_span">
                        <img src="./blocklyduino/media/Eclipse_papyrus_logo.png"
                            style="width: 30px; height: 30px; vertical-align: middle;" />
                    </span>
                </button>
                <br>
                <br>
                <input type="text" class="controlPanelInput" id="arrowheadConnectInput" name="arrowheadConnectInput">
                <button id="registerToOrchestrator" class="iconButtons CLI" onclick="ArrowheadRegister()">
                    <span id="registerToOrchestrator_span">
                        <img src="./blocklyduino/media/arrowheadtools_invert.png"
                            style="width: 30px; height: 30px; vertical-align: middle;" />
                    </span>
                </button>
                <br>
                <br>
                <input type="text" class="controlPanelInput" id="blynkConnectInput" name="blynkConnectInput">
                <button id="blynkConnect" class="iconButtons CLI" onclick="">

            </div>
        </div>
    </div>
    <div id="overlayForModals" class="overlay"></div>
    <div id="boardListModal" class="modal">
        <div class="modal-content">

                <i class="fas fa-microchip"></i>

                    <select id="boardDescriptionSelector" size="11" onchange="Code.boardDescription()">
                        <optgroup label="C / C++">

                        </optgroup>
                    </select>
                </div>
            </div>
            <button id="boardListModalDialogOkay" onclick="Code.changeBoard()">&#10004;</button>
        </div>
    </div>
</body>

<script src="https://edrys-labs.github.io/module/edrys.js"></script>

<script>
    window.run = function () {
        try {
            console.warn("Edrys is working", Edrys)
            Edrys.sendMessage(Edrys.module.config?.runCommand || "execute", Code.getArduino())
        } catch (e) {
            console.warn("Edrys not working")
        }
    }

    // Room state keys: the shared workspace and board, and the config values
    // (config.code, config.board) they were started from.
    const STATE_XML = "blocklyXml"
    const STATE_SEED = "blocklySeed"
    const STATE_BOARD = "blocklyBoard"
    const STATE_BOARD_SEED = "blocklyBoardSeed"

    // Last workspace XML applied from or written to the room state. Loading a
    // workspace fires Blockly change events; comparing against this keeps a
    // peer from writing back what it just received.
    let synced = ""

    function workspaceXml() {
        return Blockly.Xml.domToText(Blockly.Xml.workspaceToDom(Blockly.getMainWorkspace()))
    }

    function apply(xml) {
        synced = xml
        Code.loadBlocksfromXml(xml, false)
    }

    function callback(delay=2000) {
        let timerID = null

        function publish() {
            timerID = null
            const text = workspaceXml()
            if (text === synced) return
            synced = text
            Edrys.getState(STATE_XML, "Value", text)
        }

        return () => {
            if (timerID) {
                window.clearTimeout(timerID)
            }

            timerID = window.setTimeout(publish, delay)
        }
    }

    function showError(message) {
        const item = document.createElement("div")
        item.textContent = message
        const box = document.getElementById("edrysErrors")
        box.appendChild(item)
        box.hidden = false
    }

    function applyBoard(id) {
        if (!id || id === document.getElementById("boardMenu").value) return
        if (!profile[id]) {
            showError('Unknown board "' + id + '" in the room; the board was not changed.')
            return
        }
        Code.changeBoard(id)
    }

    // Loads xml, reporting what went wrong instead of throwing.
    function tryApply(xml, what) {
        try {
            apply(xml)
            return true
        } catch (e) {
            showError(what + " could not be loaded: " + e.message)
            return false
        }
    }

    Edrys.onReady(() => {
        const config = Edrys.module.config
        if (config && typeof config !== "object") {
            showError("The module settings are not valid JSON/YAML; they were ignored.")
        }
        const { code: startCode, board } = (typeof config === "object" && config) || {}

        // Teachers and stations may change the board for the room. This only
        // hides the button; it is not a permission check.
        if (Edrys.role !== "student") {
            document.getElementById("boardButton").style.display = ""
        }

        // The room's board: config.board is where it starts, like config.code.
        if (board && !profile[board]) {
            showError('Unknown board "' + board + '" in the module settings. Known boards: ' +
                Object.keys(profile).filter((id) => id !== "none" && id !== "default").join(", ") + ".")
        } else if (board && (!Edrys.getState(STATE_BOARD, "Value") || Edrys.getState(STATE_BOARD_SEED, "Value") !== board)) {
            Edrys.updateState(() => {
                Edrys.getState(STATE_BOARD_SEED, "Value", board)
                Edrys.getState(STATE_BOARD, "Value", board)
            })
        }
        applyBoard(Edrys.getState(STATE_BOARD, "Value"))

        window.edrysBoardCallback = (id) => Edrys.getState(STATE_BOARD, "Value", id)

        const room = Edrys.getState()
        const current = Edrys.getState(STATE_XML, "Value")

        // Start from config.code only if the room has no program yet, or the
        // teacher changed config.code since the program was started. It is
        // written to the room only once it loaded, so a broken start program
        // does not reach the other peers.
        if (startCode && (!current || Edrys.getState(STATE_SEED, "Value") !== startCode)) {
            if (tryApply(startCode, "The start program in the module settings")) {
                // Store the loaded workspace, not startCode: block ids are
                // assigned on load, and a peer publishing them later would
                // overwrite edits made in the meantime.
                synced = workspaceXml()
                Edrys.updateState(() => {
                    Edrys.getState(STATE_SEED, "Value", startCode)
                    Edrys.getState(STATE_XML, "Value", synced)
                })
            } else if (current) {
                tryApply(current, "The shared program")
            }
        } else if (current) {
            tryApply(current, "The shared program")
        }

        room.observe((event) => {
            if (event.transaction.local) return
            // the board first: loading blocks depends on its pin lists
            if (event.keysChanged.has(STATE_BOARD)) applyBoard(room.get(STATE_BOARD))
            if (!event.keysChanged.has(STATE_XML)) return
            const xml = room.get(STATE_XML)
            if (xml && xml !== synced) tryApply(xml, "A change from another participant")
        })

        window.edrysCallback = callback()
    });

   
        

   
</script>
