<!DOCTYPE HTML>
<HTML>

<head>
    <meta name="fetch" content="false">
    <meta name="description"
        content="Program <a href='https://www.arduino.cc' target='_blank'>Arduino</a> boards with blocks, together: everyone in a room edits one program, and the run button sends the generated code to the station. Configuration options:<br><br><a href='https://github.com/edrys-labs/module-blockly-duino-v2' target='_blank'>https://github.com/edrys-labs/module-blockly-duino-v2</a>" />
    <meta name="show-in" content="*" />
    <meta charset="utf-8">
    <meta name="google" value="notranslate">
    <meta http-equiv="X-Content-Security-Policy" content="default-src 'self'; script-src 'self'">
    <meta 
      name="module-config" 
      content="{
        'config': {
          'code': {
            'type': 'code-area',
            'hint': 'Blockly XML the room starts with (save it from the editor menu, or see the README). Empty: start with an empty program.'
          },
          'board': {
            'type': 'select',
            'options': ['arduino_uno', 'arduino_nano', 'arduino_mini', 'arduino_pro8', 'arduino_pro16', 'lilypad', 'arduino_mega', 'arduino_leonardo', 'arduino_micro', 'arduino_yun'],
            'hint': 'Board the room starts with; sets the pins the blocks offer. Teachers and stations can change it in class.'
          },
          'runCommand': {
            'type': 'string',
            'hint': 'Subject the run button sends the Arduino code with, e.g. to a terminal module (default: execute)'
          }
        }
      }"
    />

    <title>blocklyduino</title>
    <link rel="icon" type="image/png" href="blocklyduino/media/logo_only.png" />
    <link rel="stylesheet" href="css/font_awesome_all.min.css" />
    <link rel="stylesheet" href="css/keyboard_nav.css" />
    <link rel="stylesheet" href="css/lateral-panel.css" />
    <link rel="stylesheet" href="css/UI.css" />
    <link rel="stylesheet" href="blocklyduino/css/blocklyduino.css" />
    <link rel="stylesheet" href="blocklyduino/css/override_css.css" />
    <style>
        /* Problems with the Edrys configuration, pinned over the bottom of the workspace. */
        #edrysErrors {
            position: fixed;
            left: 0.5rem;
            right: 0.5rem;
            bottom: 0.5rem;
            z-index: 100;
            padding: 0.5rem 0.75rem;
            border-radius: 6px;
            background: #b8384a;
            color: #fff;
            font-family: sans-serif;
        }
        #edrysErrors[hidden] {
            display: none;
        }
        #boardLabel {
            margin-left: 0.5rem;
            font-weight: normal;
        }
        /* Setup opens from the menu; its tab would sit over the run button. */
        #lateral-panel-setup-label {
            display: none;
        }
        #lateral-panel-setup,
        #lateral-panel-setup-bloc {
            max-width: 100vw;
        }
        #setup_header {
            padding: 0.5rem 0.75rem;
            background-color: #006468;
            color: #fff;
            font-size: x-large;
            font-weight: bold;
        }
        #setup_content label.UIText {
            margin-right: 0.25rem;
        }
        /* menu entries open on their text as well as their icon */
        .menu_text {
            cursor: pointer;
        }
        /* The layout table: keep it at the module's width. Its cells would
           otherwise grow with the block area, which init.js sizes to them. */
        #globalTable {
            table-layout: fixed;
        }
        /* The board dialog never gets wider than the module. */
        .modal {
            max-width: calc(100% - 1rem);
            left: max(0.5rem, calc(50% - 350px));
        }
        /* Narrow modules: the blocks get the whole width (the code is still
           sent by the run button and copied by the copy button), and the
           top bar keeps to one row. */
        @media (max-width: 600px) {
            #content_area {
                width: 100% !important;
            }
            #separator,
            #content_code,
            #appName,
            #board_mini_picture_div {
                display: none;
            }
        }
        @media (max-width: 420px) {
            /* the code is not shown at this width anyway */
            #boardLabel,
            #copyCodeButton {
                display: none;
            }
        }
        .helpModal {
            max-width: calc(100% - 3rem);
        }
    </style>
</head>

<script src="https://edrys-labs.github.io/module/edrys.js"></script>

<script>
    window.run = function () {
        try {
            console.warn("Edrys is working", Edrys)
            Edrys.sendMessage(Edrys.module.config?.runCommand || "execute", Code.getArduino())
        } catch (e) {
            console.warn("Edrys not working")
        }
    }

    // Room state keys: the shared workspace and board, and the config values
    // (config.code, config.board) they were started from.
    const STATE_XML = "blocklyXml"
    const STATE_SEED = "blocklySeed"
    const STATE_BOARD = "blocklyBoard"
    const STATE_BOARD_SEED = "blocklyBoardSeed"

    // Last workspace XML applied from or written to the room state. Loading a
    // workspace fires Blockly change events; comparing against this keeps a
    // peer from writing back what it just received.
    let synced = ""

    function workspaceXml() {
        return Blockly.Xml.domToText(Blockly.Xml.workspaceToDom(Blockly.getMainWorkspace()))
    }

    function apply(xml) {
        synced = xml
        Code.loadBlocksfromXml(xml, false)
    }

    function callback(delay=2000) {
        let timerID = null

        function publish() {
            timerID = null
            const text = workspaceXml()
            if (text === synced) return
            synced = text
            Edrys.getState(STATE_XML, "Value", text)
        }

        return () => {
            if (timerID) {
                window.clearTimeout(timerID)
            }

            timerID = window.setTimeout(publish, delay)
        }
    }

    function showError(message) {
        const item = document.createElement("div")
        item.textContent = message
        const box = document.getElementById("edrysErrors")
        box.appendChild(item)
        box.hidden = false
    }

    function applyBoard(id) {
        if (!id || id === document.getElementById("boardMenu").value) return
        if (!profile[id]) {
            showError('Unknown board "' + id + '" in the room; the board was not changed.')
            return
        }
        Code.changeBoard(id)
    }

    // Loads xml, reporting what went wrong instead of throwing.
    function tryApply(xml, what) {
        try {
            apply(xml)
            return true
        } catch (e) {
            showError(what + " could not be loaded: " + e.message)
            return false
        }
    }

    Edrys.onReady(() => {
        const config = Edrys.module.config
        if (config && typeof config !== "object") {
            showError("The module settings are not valid JSON/YAML; they were ignored.")
        }
        const { code: startCode, board } = (typeof config === "object" && config) || {}

        // Teachers and stations may change the board for the room. This only
        // hides the button; it is not a permission check.
        if (Edrys.role !== "student") {
            document.getElementById("boardButton").style.display = ""
        }

        // The room's board: config.board is where it starts, like config.code.
        if (board && !profile[board]) {
            showError('Unknown board "' + board + '" in the module settings. Known boards: ' +
                Object.keys(profile).filter((id) => id !== "none" && id !== "default").join(", ") + ".")
        } else if (board && (!Edrys.getState(STATE_BOARD, "Value") || Edrys.getState(STATE_BOARD_SEED, "Value") !== board)) {
            Edrys.updateState(() => {
                Edrys.getState(STATE_BOARD_SEED, "Value", board)
                Edrys.getState(STATE_BOARD, "Value", board)
            })
        }
        applyBoard(Edrys.getState(STATE_BOARD, "Value"))

        window.edrysBoardCallback = (id) => Edrys.getState(STATE_BOARD, "Value", id)

        // Reset (menu): back to the start program and board from the module
        // settings, for the whole room.
        window.edrysReset = () => {
            if (board && profile[board]) applyBoard(board)
            if (!startCode || !tryApply(startCode, "The start program in the module settings")) {
                Code.workspace.clear()
            }
            synced = workspaceXml()
            Edrys.updateState(() => {
                if (board && profile[board]) Edrys.getState(STATE_BOARD, "Value", board)
                Edrys.getState(STATE_XML, "Value", synced)
            })
        }

        const room = Edrys.getState()
        const current = Edrys.getState(STATE_XML, "Value")

        // Start from config.code only if the room has no program yet, or the
        // teacher changed config.code since the program was started. It is
        // written to the room only once it loaded, so a broken start program
        // does not reach the other peers.
        if (startCode && (!current || Edrys.getState(STATE_SEED, "Value") !== startCode)) {
            if (tryApply(startCode, "The start program in the module settings")) {
                // Store the loaded workspace, not startCode: block ids are
                // assigned on load, and a peer publishing them later would
                // overwrite edits made in the meantime.
                synced = workspaceXml()
                Edrys.updateState(() => {
                    Edrys.getState(STATE_SEED, "Value", startCode)
                    Edrys.getState(STATE_XML, "Value", synced)
                })
            } else if (current) {
                tryApply(current, "The shared program")
            }
        } else if (current) {
            tryApply(current, "The shared program")
        }

        room.observe((event) => {
            if (event.transaction.local) return
            // the board first: loading blocks depends on its pin lists
            if (event.keysChanged.has(STATE_BOARD)) applyBoard(room.get(STATE_BOARD))
            if (!event.keysChanged.has(STATE_XML)) return
            const xml = room.get(STATE_XML)
            if (xml && xml !== synced) tryApply(xml, "A change from another participant")
        })

        window.edrysCallback = callback()
    });

   
        

   
</script>

</HTML>
